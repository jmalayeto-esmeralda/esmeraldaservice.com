<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Página no encontrada | Esmeralda Legal Services</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f5ef;color:#22312d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:680px;padding:48px 28px;text-align:center}
    img{width:260px;max-width:70%;height:auto;margin-bottom:28px}
    h1{font-family:Georgia,serif;font-size:clamp(42px,7vw,76px);margin:0 0 16px;color:#22312d}
    p{font-size:18px;line-height:1.6;color:#526863;margin:0 0 28px}
    a{display:inline-block;background:#315d52;color:#fff;text-decoration:none;padding:14px 24px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
  
/* V54 brand system logo integration */
.nav-logo .brand-wordmark,.brand .brand-word{height:auto!important;width:250px!important;max-width:min(250px, calc(100vw - 170px))!important;min-width:0!important;object-fit:contain!important;object-position:left center!important;display:block!important}
.nav-logo,.brand{gap:0!important}
.footer-logo-lockup img.brand-wordmark, footer .brand-wordmark, footer img[src*="esmeralda-legal-services"], footer img[src*="esmeralda-venture-studio"]{height:auto!important;width:230px!important;max-width:100%!important;object-fit:contain!important}
@media(max-width:680px){.nav-logo .brand-wordmark,.brand .brand-word{width:205px!important;max-width:min(205px, calc(100vw - 135px))!important}}

</style>
</head>
<body>
  <main>
    <img src="/assets/esmeralda-legal-services.png" alt="Esmeralda Legal Services">
    <h1>404</h1>
    <p>La página solicitada no está disponible. Puede volver al inicio o contactarnos directamente.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
